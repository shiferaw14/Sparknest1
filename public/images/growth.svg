<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011f14" />
      <stop offset="50%" stop-color="#023020" />
      <stop offset="100%" stop-color="#00140c" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="35%" stop-color="#D3AF37" />
      <stop offset="70%" stop-color="#C9921A" />
      <stop offset="100%" stop-color="#7B5608" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFFFDC" />
      <stop offset="100%" stop-color="#07501B" />
    </linearGradient>
    <radialGradient id="growAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#D3AF37" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#023020" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00140c" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="400" cy="190" r="260" fill="url(#growAura)" />

  <!-- Ascending Compound Growth Curve -->
  <path d="M 160 370 Q 380 360 480 230 T 640 90" stroke="url(#gold)" stroke-width="3" fill="none" filter="url(#glow)" />
  <path d="M 160 370 Q 380 360 480 230 T 640 90 L 640 370 Z" fill="url(#gold)" opacity="0.08" />

  <!-- Sustainable Branching Helix / Ascending Spire of Leaves -->
  <g filter="url(#glow)">
    <!-- Branch 1 (Base) -->
    <path d="M 280 360 C 260 330, 240 320, 210 325 C 220 350, 250 365, 280 360 Z" fill="url(#gold)" opacity="0.75" />
    <!-- Branch 2 -->
    <path d="M 360 330 C 340 290, 310 280, 280 290 C 295 320, 330 335, 360 330 Z" fill="url(#gold)" opacity="0.85" />
    <path d="M 370 320 C 400 290, 430 290, 450 310 C 430 330, 395 330, 370 320 Z" fill="url(#mintGrad)" opacity="0.85" />
    <!-- Branch 3 -->
    <path d="M 440 270 C 415 225, 380 220, 350 235 C 370 265, 410 275, 440 270 Z" fill="url(#gold)" />
    <path d="M 460 250 C 500 215, 535 225, 545 250 C 520 265, 480 260, 460 250 Z" fill="url(#mintGrad)" />
    <!-- Apex Summit -->
    <polygon points="640,90 615,115 625,125 640,90" fill="#FFFFFF" />
    <polygon points="640,90 645,120 635,125 640,90" fill="url(#gold)" />
    
    <!-- Summit Golden Star -->
    <circle cx="640" cy="90" r="5" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="640" cy="90" r="14" stroke="url(#gold)" stroke-width="1.5" fill="none" />
  </g>

  <!-- Stepping Stones of Milestone Growth -->
  <g filter="url(#glow)">
    <circle cx="280" cy="355" r="4" fill="#FFF9D2" />
    <circle cx="370" cy="315" r="4.5" fill="#FFF9D2" />
    <circle cx="455" cy="245" r="5" fill="#FFF9D2" />
    <circle cx="540" cy="165" r="5.5" fill="#FFF9D2" />
  </g>

  <!-- Compound Yield Indicator Grid -->
  <line x1="160" y1="370" x2="660" y2="370" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.4" />
</svg>