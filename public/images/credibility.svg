<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011f14" />
      <stop offset="50%" stop-color="#023020" />
      <stop offset="100%" stop-color="#00140c" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="35%" stop-color="#D3AF37" />
      <stop offset="70%" stop-color="#C9921A" />
      <stop offset="100%" stop-color="#7B5608" />
    </linearGradient>
    <radialGradient id="credAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D3AF37" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#023020" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00140c" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="400" cy="225" r="260" fill="url(#credAura)" />

  <!-- Classical Monumental Pediment (Symbol of Institutional Strength) -->
  <polygon points="400,100 560,160 240,160" fill="#011f14" stroke="url(#gold)" stroke-width="2.5" />
  <polygon points="400,115 540,160 260,160" fill="url(#gold)" opacity="0.2" />

  <!-- Laurel Wreath of Undeniable Authority -->
  <g filter="url(#glow)">
    <!-- Laurel Leaves Left -->
    <path d="M 330 330 C 270 290, 260 200, 310 150" stroke="url(#gold)" stroke-width="2.5" fill="none" />
    <polygon points="275,200 290,195 285,210" fill="url(#gold)" />
    <polygon points="270,240 288,235 280,250" fill="url(#gold)" />
    <polygon points="280,275 300,270 292,285" fill="url(#gold)" />
    <polygon points="305,305 322,300 318,318" fill="url(#gold)" />

    <!-- Laurel Leaves Right -->
    <path d="M 470 330 C 530 290, 540 200, 490 150" stroke="url(#gold)" stroke-width="2.5" fill="none" />
    <polygon points="525,200 510,195 515,210" fill="url(#gold)" />
    <polygon points="530,240 512,235 520,250" fill="url(#gold)" />
    <polygon points="520,275 500,270 508,285" fill="url(#gold)" />
    <polygon points="495,305 478,300 482,318" fill="url(#gold)" />

    <!-- Medallion Seal Centerpiece -->
    <circle cx="400" cy="235" r="65" fill="#011f14" stroke="url(#gold)" stroke-width="3" />
    <circle cx="400" cy="235" r="54" fill="url(#gold)" opacity="0.25" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="3 4" />
    
    <!-- Central Five-Point Star of Supreme Standing -->
    <polygon points="400,195 412,225 440,225 418,245 426,275 400,258 374,275 382,245 360,225 388,225" fill="url(#gold)" />
    <circle cx="400" cy="235" r="8" fill="#FFF9D2" />
  </g>

  <!-- Grounding Base Plinth -->
  <rect x="220" y="360" width="360" height="15" rx="3" fill="url(#gold)" opacity="0.8" />
  <rect x="180" y="375" width="440" height="20" rx="4" fill="url(#gold)" opacity="0.4" />
</svg>