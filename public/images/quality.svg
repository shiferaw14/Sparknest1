<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011f14" />
      <stop offset="50%" stop-color="#023020" />
      <stop offset="100%" stop-color="#00140c" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#C9921A" />
      <stop offset="100%" stop-color="#7B5608" />
    </linearGradient>
    <radialGradient id="gemAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D3AF37" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#023020" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00140c" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="400" cy="210" r="260" fill="url(#gemAura)" />

  <!-- Pedestal Platform / Stage of Excellence -->
  <polygon points="260,330 540,330 580,360 220,360" fill="url(#gold)" opacity="0.3" />
  <line x1="200" y1="360" x2="600" y2="360" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- The Master Diamond of Quality -->
  <g filter="url(#glow)">
    <!-- Crown Facets (Top) -->
    <polygon points="340,140 460,140 520,200 280,200" fill="#012b1c" stroke="url(#gold)" stroke-width="2.5" />
    <polygon points="340,140 460,140 430,200 370,200" fill="url(#gold)" opacity="0.4" />
    <polygon points="340,140 370,200 280,200" fill="url(#gold)" opacity="0.6" />
    <polygon points="460,140 520,200 430,200" fill="url(#gold)" opacity="0.25" />

    <!-- Pavilion Facets (Bottom) -->
    <polygon points="280,200 520,200 400,320" fill="#011f14" stroke="url(#gold)" stroke-width="2.5" />
    <polygon points="280,200 370,200 400,320" fill="url(#gold)" opacity="0.75" />
    <polygon points="370,200 430,200 400,320" fill="#FFF9D2" opacity="0.9" />
    <polygon points="430,200 520,200 400,320" fill="url(#gold)" opacity="0.4" />
  </g>

  <!-- Sparkle Flares on Vertex Points -->
  <g filter="url(#glow)">
    <circle cx="340" cy="140" r="3" fill="#FFF9D2" />
    <circle cx="460" cy="140" r="3" fill="#FFF9D2" />
    <circle cx="400" cy="140" r="4" fill="#FFFFFF" />
    <circle cx="400" cy="320" r="3.5" fill="#FFF9D2" />
    <circle cx="280" cy="200" r="2.5" fill="#FFF9D2" />
    <circle cx="520" cy="200" r="2.5" fill="#FFF9D2" />
  </g>

  <!-- Subtle Precision Measurement Grid -->
  <circle cx="400" cy="220" r="170" stroke="url(#gold)" stroke-width="1" stroke-dasharray="2 6" fill="none" opacity="0.25" />
</svg>