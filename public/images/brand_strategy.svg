<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011f14" />
      <stop offset="50%" stop-color="#023020" />
      <stop offset="100%" stop-color="#00140c" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="35%" stop-color="#D3AF37" />
      <stop offset="70%" stop-color="#C9921A" />
      <stop offset="100%" stop-color="#7B5608" />
    </linearGradient>
    <radialGradient id="stratAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D3AF37" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#023020" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00140c" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="400" cy="225" r="260" fill="url(#stratAura)" />

  <!-- Perspective Isometric Strategic Grid (Chessboard Blueprint) -->
  <g stroke="url(#gold)" stroke-width="1.2" stroke-opacity="0.35">
    <!-- Isometric Grid Lines -->
    <path d="M 400 370 L 640 250 L 400 130 L 160 250 Z" fill="#011810" />
    <line x1="220" y1="220" x2="460" y2="340" />
    <line x1="280" y1="190" x2="520" y2="310" />
    <line x1="340" y1="160" x2="580" y2="280" />
    <line x1="340" y1="340" x2="580" y2="220" />
    <line x1="280" y1="310" x2="520" y2="190" />
    <line x1="220" y1="280" x2="460" y2="160" />
  </g>

  <!-- Strategic King / Masterpiece Chess Piece -->
  <g filter="url(#glow)">
    <!-- Crown Cross -->
    <line x1="400" y1="95" x2="400" y2="120" stroke="url(#gold)" stroke-width="3" />
    <line x1="390" y1="105" x2="410" y2="105" stroke="url(#gold)" stroke-width="3" />
    
    <!-- King Crown Head -->
    <polygon points="380,135 390,120 400,130 410,120 420,135 400,145" fill="url(#gold)" />
    
    <!-- King Body Column -->
    <path d="M 385 145 C 385 180, 375 220, 365 260 L 435 260 C 425 220, 415 180, 415 145 Z" fill="#012b1c" stroke="url(#gold)" stroke-width="2.5" />
    <path d="M 390 155 C 390 185, 385 220, 375 250 L 425 250 C 415 220, 410 185, 410 155 Z" fill="url(#gold)" opacity="0.4" />

    <!-- King Base Pedestal -->
    <polygon points="350,260 450,260 465,285 335,285" fill="url(#gold)" />
    <ellipse cx="400" cy="285" rx="65" ry="15" fill="#FFF9D2" opacity="0.8" />
  </g>

  <!-- Constellation Strategy Nodes & vectors -->
  <g filter="url(#glow)">
    <line x1="400" y1="100" x2="250" y2="150" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" />
    <line x1="400" y1="100" x2="560" y2="140" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" />
    <circle cx="250" cy="150" r="4" fill="#FFF9D2" />
    <circle cx="560" cy="140" r="4" fill="#FFF9D2" />
    <circle cx="200" cy="220" r="3" fill="#D3AF37" />
    <circle cx="610" cy="210" r="3" fill="#D3AF37" />
  </g>
</svg>