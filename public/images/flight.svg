<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011f14" />
      <stop offset="50%" stop-color="#023020" />
      <stop offset="100%" stop-color="#00140c" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#D3AF37" />
      <stop offset="70%" stop-color="#C9921A" />
      <stop offset="100%" stop-color="#7B5608" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D3AF37" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#C9921A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#023020" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="400" cy="180" r="260" fill="url(#sunGlow)" />

  <!-- Ascension Golden Rays -->
  <g stroke="url(#gold)" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="400" y1="200" x2="200" y2="20" />
    <line x1="400" y1="200" x2="280" y2="10" />
    <line x1="400" y1="200" x2="400" y2="0" />
    <line x1="400" y1="200" x2="520" y2="10" />
    <line x1="400" y1="200" x2="600" y2="20" />
  </g>

  <!-- Geometric Rising Falcon / Flight Form -->
  <g filter="url(#glow)">
    <!-- Wings Left -->
    <polygon points="400,210 320,170 230,130 330,225" fill="url(#gold)" opacity="0.9" />
    <polygon points="330,225 240,180 180,160 300,250" fill="url(#gold)" opacity="0.75" />
    <polygon points="300,250 220,220 160,210 280,270" fill="url(#gold)" opacity="0.6" />
    
    <!-- Wings Right -->
    <polygon points="400,210 480,170 570,130 470,225" fill="url(#gold)" opacity="0.9" />
    <polygon points="470,225 560,180 620,160 500,250" fill="url(#gold)" opacity="0.75" />
    <polygon points="500,250 580,220 640,210 520,270" fill="url(#gold)" opacity="0.6" />

    <!-- Falcon Head & Body -->
    <polygon points="400,140 415,185 400,280 385,185" fill="#FFF2A3" />
    <polygon points="400,140 408,125 400,115 392,125" fill="#FFF2A3" />
    <polygon points="400,280 410,340 400,320 390,340" fill="url(#gold)" opacity="0.8" />
  </g>

  <!-- Trailing Sparks & Stars -->
  <circle cx="400" cy="115" r="3" fill="#FFF2A3" filter="url(#glow)" />
  <circle cx="230" cy="130" r="2.5" fill="#FFF2A3" />
  <circle cx="570" cy="130" r="2.5" fill="#FFF2A3" />
  <circle cx="390" cy="360" r="2" fill="#D3AF37" opacity="0.6" />
  <circle cx="415" cy="380" r="2" fill="#D3AF37" opacity="0.7" />
  <circle cx="402" cy="405" r="1.5" fill="#D3AF37" opacity="0.5" />
  <circle cx="370" cy="290" r="1.5" fill="#CFFFDC" opacity="0.8" />
  <circle cx="430" cy="300" r="1.5" fill="#CFFFDC" opacity="0.8" />

  <!-- Bottom Elegant Frame Arch -->
  <path d="M 150 420 Q 400 370 650 420" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
</svg>